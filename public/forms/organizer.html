<section id="form" class="panel form-panel" aria-labelledby="form-title">
  <div class="form-intro">
    <h1 id="form-title" tabindex="-1">주관자 사후 보고</h1>
    <p>주관한 타임과 활동 결과를 기록해 주세요.</p>
  </div>
  <form id="report-form" method="post" data-role="organizer">
    <fieldset class="form-section">
      <legend>활동 정보</legend>
      <div class="fields activity-fields">
        <div class="date-field">
          <label for="activity-date">활동일 <span class="required" aria-hidden="true">*</span></label>
          <input id="activity-date" type="text" name="date" placeholder="날짜를 선택해 주세요" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" maxlength="10" autocomplete="off" inputmode="none" aria-haspopup="dialog" required>
        </div>
        <label>주관 타임 <span class="required" aria-hidden="true">*</span>
          <select name="slot" required>
            <option value="">타임을 선택해 주세요</option>
            <option>1타임</option><option>2타임</option><option>3타임</option><option>그 외</option>
          </select>
        </label>
        <label class="activity-location">활동 장소 <span class="required" aria-hidden="true">*</span>
          <select name="location" required>
            <option value="">장소를 선택해 주세요</option>
            <option>강동</option>
            <option>건대</option>
            <option>광나루</option>
            <option>구리</option>
            <option>군자</option>
            <option>길동</option>
            <option>둔촌동</option>
            <option>미사</option>
            <option>송파</option>
            <option>어린이대공원</option>
            <option>왕십리</option>
            <option>자양역</option>
            <option>잠실</option>
            <option>천호</option>
            <option value="custom" hidden disabled>직접 입력</option>
          </select>
        </label>
        <label class="full" hidden>활동 장소 직접 입력 <span class="required" aria-hidden="true">*</span>
          <input type="text" name="customLocation" maxlength="80" placeholder="활동 장소를 입력해 주세요" disabled>
        </label>
        <fieldset class="time-field full" aria-describedby="organizer-time-guide">
          <legend>주관 시간 <span class="required" aria-hidden="true">*</span></legend>
          <div id="organizer-time-guide">
            <p class="time-guide time-format" data-time-format hidden>24시간제 · 1530 → 15:30</p>
          </div>
          <div class="time-row" data-time-row>
            <label>시작시간 <input type="time" data-time-start required></label>
            <span class="time-separator" aria-hidden="true">–</span>
            <label>종료시간 <input type="time" data-time-end required></label>
          </div>
        </fieldset>
        <div class="fields full">
          <label>주관자 성명 <span class="required" aria-hidden="true">*</span><input name="name" autocomplete="name" maxlength="80" placeholder="성명을 입력해 주세요" required></label>
          <label>물약 포지션 <span class="optional">선택</span><input name="potionName" maxlength="80" placeholder="성명을 입력해 주세요"></label>
        </div>
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>주관자 체크리스트 <span class="required" aria-hidden="true">*</span></legend>
      <p class="rating-guide">문항마다 예 또는 아니오를 골라 주세요.</p>
      <fieldset class="rating-question">
        <legend>1. 묵상 말씀 준비를 하였는가?</legend>
        <div class="score-options binary-options">
          <label><input type="radio" name="organizerCheck1" value="yes" required><span>예</span></label>
          <label><input type="radio" name="organizerCheck1" value="no"><span>아니오</span></label>
        </div>
      </fieldset>
      <fieldset class="rating-question">
        <legend>2. 인원 목표를 확인했는가?</legend>
        <div class="score-options binary-options">
          <label><input type="radio" name="organizerCheck2" value="yes" required><span>예</span></label>
          <label><input type="radio" name="organizerCheck2" value="no"><span>아니오</span></label>
        </div>
      </fieldset>
      <fieldset class="rating-question">
        <legend>3. 분위기를 살펴보며 독려하였는가?</legend>
        <div class="score-options binary-options">
          <label><input type="radio" name="organizerCheck3" value="yes" required><span>예</span></label>
          <label><input type="radio" name="organizerCheck3" value="no"><span>아니오</span></label>
        </div>
      </fieldset>
      <fieldset class="rating-question">
        <legend>4. 2인 1조 짝을 잘 지었는가?</legend>
        <div class="score-options binary-options">
          <label><input type="radio" name="organizerCheck4" value="yes" required><span>예</span></label>
          <label><input type="radio" name="organizerCheck4" value="no"><span>아니오</span></label>
        </div>
      </fieldset>
    </fieldset>

    <fieldset class="form-section">
      <legend>활동 결과</legend>
      <div class="fields">
        <label>활동자 수 <span class="required" aria-hidden="true">*</span><input type="number" name="headcount" min="0" step="1" inputmode="numeric" placeholder="명" required></label>
        <label>전체 찾기 건수 <span class="required" aria-hidden="true">*</span><input type="number" name="findings" min="0" step="1" inputmode="numeric" placeholder="건" required></label>
        <label>본인 찾기 건수 <span class="optional">선택</span><input type="number" name="personalFindings" min="0" step="1" inputmode="numeric" placeholder="건"></label>
        <label class="full">특이사항 <span class="optional">선택</span><textarea name="notes" rows="3" maxlength="1500" placeholder="함께 공유할 내용이 있다면 적어주세요."></textarea></label>
      </div>
    </fieldset>

    <fieldset class="form-section" aria-describedby="omega3-help" hidden disabled>
      <legend>오메가-3</legend>
      <p id="omega3-help" class="checklist-guide">완료한 항목에 체크해 주세요.</p>
      <div class="checklist-options">
        <label><input type="checkbox" name="omega3AfterReport"> 사후</label>
        <label><input type="checkbox" name="omega3Tm"> 티엠</label>
        <label><input type="checkbox" name="omega3Prayer"> 기도</label>
      </div>
    </fieldset>

    <input type="hidden" name="reportVersion" value="3">
    <p class="error" id="submit-error" role="alert" hidden></p>
    <div class="actions"><button type="button" class="button secondary" data-home>처음으로</button><button class="button primary" type="submit" id="send">사후 보고 제출 <span aria-hidden="true">→</span></button></div>
  </form>
</section>

<section id="done" class="panel ending" aria-labelledby="done-title" hidden>
  <div class="check" aria-hidden="true">✓</div>
  <h1 id="done-title" tabindex="-1">제출이 완료됐어요</h1>
  <p>오늘의 활동을 기록해 주셔서 감사합니다.</p>
  <p id="receipt" class="receipt"></p>
  <button type="button" class="button secondary" data-home>처음으로</button>
</section>

<section id="form" class="panel form-panel" aria-labelledby="form-title">
  <div class="form-intro">
    <p class="eyebrow">활동 기록</p>
    <h1 id="form-title" tabindex="-1">주관자 사후 보고</h1>
    <p>해당 활동을 선택한 뒤, 아래 항목을 작성해 주세요.</p>
  </div>
  <form id="report-form" method="post" data-role="organizer">
    <fieldset class="form-section">
      <legend><span>01</span> 활동 정보</legend>
      <div class="fields">
        <div class="date-field">
          <label for="activity-date">활동일 <span class="required" aria-hidden="true">*</span></label>
          <input id="activity-date" type="text" name="date" placeholder="날짜를 선택해 주세요" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" maxlength="10" autocomplete="off" inputmode="none" aria-haspopup="dialog" required>
        </div>
        <label>활동 시간 <span class="required" aria-hidden="true">*</span>
          <select name="slot" required>
            <option value="">타임을 선택해 주세요</option>
            <option>1타임</option><option>2타임</option><option>3타임</option><option>그 외</option>
          </select>
        </label>
        <label id="other-field" class="full" hidden>추가 회차 코드 <span class="required" aria-hidden="true">*</span>
          <input name="otherCode" maxlength="40" placeholder="예: 추가-01" aria-describedby="other-help" disabled>
          <small id="other-help">‘그 외’ 활동에 안내된 회차 코드를 입력해 주세요.</small>
        </label>
        <label class="full">주관자 성명 <span class="required" aria-hidden="true">*</span><input name="name" autocomplete="name" maxlength="80" placeholder="성명을 입력해 주세요" required></label>
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend><span>02</span> 활동 결과</legend>
      <div class="fields">
        <label>활동 인원 수 <span class="required" aria-hidden="true">*</span><input type="number" name="headcount" min="0" step="1" inputmode="numeric" placeholder="명" required></label>
        <label>전체 찾기 건수 <span class="required" aria-hidden="true">*</span><input type="number" name="findings" min="0" step="1" inputmode="numeric" placeholder="건" required></label>
        <label class="full">활동 변경·지연·누락 사유 <span class="optional">선택</span><textarea name="changes" rows="3" maxlength="1500" placeholder="변경되거나 지연·누락된 내용과 사유를 적어주세요."></textarea></label>
        <label class="full">특이사항 <span class="optional">선택</span><textarea name="notes" rows="3" maxlength="1500" placeholder="함께 공유할 내용이 있다면 적어주세요."></textarea></label>
      </div>
    </fieldset>

    <p class="error" id="submit-error" role="alert" hidden></p>
    <div class="actions"><button type="button" class="button secondary" data-home>처음으로</button><button class="button primary" type="submit" id="send">사후 보고 제출 <span aria-hidden="true">→</span></button></div>
  </form>
</section>

<section id="done" class="panel ending" aria-labelledby="done-title" hidden>
  <div class="check" aria-hidden="true">✓</div>
  <p class="eyebrow">기록 완료</p>
  <h1 id="done-title" tabindex="-1">제출이 완료됐어요</h1>
  <p>오늘의 활동을 기록해 주셔서 감사합니다.</p>
  <p id="receipt" class="receipt"></p>
  <button type="button" class="button secondary" data-home>처음으로</button>
</section>

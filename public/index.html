<!doctype html>
<html lang="ko">
  <head>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5ee" />
    <meta
      name="description"
      content="즐기삼 활동을 마치고 남기는 사후 보고입니다."
    />
    <title>즐기삼 | 활동 사후</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&amp;display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="date-picker.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-content">
        <a href="./index.html" class="brand">
          <span class="brand-mark"><img src="assets/leaf.png" alt="" width="42" height="22" /></span>
          <span>우리 모두 <strong>즐기삼</strong></span>
        </a>
      </div>
    </header>

    <main class="shell">
      <ol class="steps" aria-label="진행 단계">
        <li data-step="cover" aria-current="step">안내</li>
        <li data-step="form">사후 작성</li>
        <li data-step="done">제출 완료</li>
      </ol>

      <section id="cover" class="panel cover" aria-labelledby="cover-title">
        <div class="cover-copy">
          <h1 id="cover-title" tabindex="-1">활동 사후 <span>보고</span></h1>
          <p class="cover-description">역할을 선택해 오늘의 활동을 기록해 주세요.</p>
          <nav class="role-actions" aria-label="작성할 사후 보고">
            <button type="button" data-role="organizer" class="role-action" aria-labelledby="organizer-action" aria-describedby="organizer-details">
              <span><strong id="organizer-action">주관자 사후</strong><small id="organizer-details">참여 인원과 전체 결과</small></span>
              <span class="role-arrow" aria-hidden="true">→</span>
            </button>
            <button type="button" data-role="participant" class="role-action" aria-labelledby="participant-action" aria-describedby="participant-details">
              <span><strong id="participant-action">활동자 사후</strong><small id="participant-details">활동 시간과 체크리스트</small></span>
              <span class="role-arrow" aria-hidden="true">→</span>
            </button>
          </nav>
          <p id="role-status" class="role-status" role="status"></p>
        </div>
        <div class="cover-visual">
          <img class="cover-image" src="assets/report-cover.webp" alt="" width="1122" height="1402" fetchpriority="high" />
        </div>
      </section>

      <div id="report-view" hidden></div>
    </main>

    <footer class="shell site-footer">
      <span>© 2026 즐기삼</span>
      <span lang="en">Have Fun, Sam!</span>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121c31" />
    <meta
      name="description"
      content="하나되어 즐기삼 주관자와 활동자의 사후 보고를 작성합니다."
    />
    <title>하나되어 즐기삼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600;750&amp;display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="date-picker.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="site-header" hidden>
      <div class="shell header-content">
        <a href="./index.html" class="brand">하나되어 즐기삼</a>
        <ol class="steps" aria-label="진행 단계">
          <li data-step="cover" aria-current="step">안내</li>
          <li data-step="form">사후 작성</li>
          <li data-step="done">제출 완료</li>
        </ol>
      </div>
    </header>

    <main>
      <section id="cover" class="cover" aria-labelledby="cover-title">
        <div class="cover-copy">
          <div class="studio-lines" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="cover-inner">
            <p class="cover-purpose">활동 사후 보고</p>
            <h1 id="cover-title" tabindex="-1">하나되어 즐기삼</h1>
          </div>
        </div>
        <div class="role-band">
          <nav class="role-actions" aria-label="작성할 사후 보고">
            <button type="button" data-role="organizer" class="role-action" aria-labelledby="organizer-action" aria-describedby="organizer-details">
              <strong id="organizer-action">주관자 사후</strong>
              <small id="organizer-details">참여 인원과 전체 결과</small>
              <span class="role-arrow" aria-hidden="true">→</span>
            </button>
            <button type="button" data-role="participant" class="role-action" aria-labelledby="participant-action" aria-describedby="participant-details">
              <strong id="participant-action">활동자 사후</strong>
              <small id="participant-details">활동 시간과 체크리스트</small>
              <span class="role-arrow" aria-hidden="true">→</span>
            </button>
          </nav>
        </div>
        <p id="role-status" class="shell role-status" role="status"></p>
      </section>

      <div id="report-view" hidden></div>
    </main>

    <footer class="shell site-footer">© 2026 하나되어 즐기삼</footer>
  </body>
</html>
